{% extends "base.html" %}
{% block title %}导出分享 — 芯片资讯{% endblock %}
{% block content %}
<div class="actionbar">
  <div class="actionbar-title">导出分享</div>
</div>
<p class="hint">把评审看板挑出的高分/标记条目导出为四种形式；或直接从本周人工评分一键生成技术周报。</p>

<section class="card">
  <h2 class="card-h">📤 从报告导出子集</h2>
  <div class="exp-grid">
    <div class="exp-field">
      <label for="exp-report">来源报告</label>
      <select id="exp-report" class="select"></select>
    </div>
    <div class="exp-field">
      <label>导出范围</label>
      <div class="radio-row" id="exp-scope">
        <label><input type="radio" name="scope" value="shared" checked> 标记为「分享」</label>
        <label><input type="radio" name="scope" value="rated_min"> 我的评分 ≥
          <input type="number" id="exp-minscore" value="7" min="1" max="10"></label>
        <label><input type="radio" name="scope" value="all"> 全部条目</label>
      </div>
    </div>
  </div>

  <div class="exp-field" style="margin-top:14px">
    <label>导出格式</label>
    <div class="fmt-row">
      <label><input type="checkbox" value="wechat" checked> 微信图文 HTML</label>
      <label><input type="checkbox" value="share_html" checked> 独立分享网页</label>
      <label><input type="checkbox" value="markdown"> Markdown 文件</label>
      <label><input type="checkbox" value="clipboard"> 复制到剪贴板</label>
    </div>
  </div>

  <div class="exp-preview" id="exp-preview">选择报告与范围后预览将导出的条目…</div>

  <div class="actionbar-btns" style="margin-top:14px">
    <button id="btn-export" class="btn btn-primary" type="button">导出</button>
  </div>
  <div class="exp-results" id="exp-results"></div>
</section>

<section class="card">
  <h2 class="card-h">🗞️ 从本周人工评分生成技术周报 <span class="muted">（取最高分 Top-N，跳过爬取与 AI 评分）</span></h2>
  <div class="exp-grid">
    <div class="exp-field">
      <label for="wk-topn">精选条数 Top-N</label>
      <input type="number" id="wk-topn" value="15" min="1" max="100">
    </div>
    <div class="exp-field">
      <label for="wk-days">取最近几天的评分</label>
      <input type="number" id="wk-days" value="7" min="1" max="60">
    </div>
  </div>
  <div class="actionbar-btns" style="margin-top:14px">
    <button id="btn-weekly" class="btn btn-primary" type="button">生成周报</button>
  </div>
  <div class="exp-results" id="wk-results"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='export.js') }}"></script>
{% endblock %}
